<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu Financeiro</title><link rel="stylesheet" href="style.css"></head><body><div id="authScreen" class="authScreen"><div class="authCard"><h1>◈ Meu Financeiro</h1><p>Acesse suas finanças com segurança.</p><div id="setupHint" class="foot"></div><form id="authForm"><label>E-mail<input id="authEmail" type="email" autocomplete="email" required></label><label>Senha<input id="authPassword" type="password" minlength="6" autocomplete="current-password" required></label><div class="authActions"><button type="submit" class="primary" id="loginBtn">Entrar</button><button type="button" id="signupBtn">Criar conta</button></div></form><p id="authNotice" role="status"></p></div></div><div class="layout hidden" id="appShell"><aside><div class="brand">◈ Meu Financeiro</div><nav><button class="nav active" data-page="dashboard">▦ Dashboard</button><button class="nav" data-page="lancamentos">⇄ Lançamentos</button><button class="nav" data-page="parcelas">▤ Parcelas</button><button class="nav" data-page="projecoes">▥ Projeções</button><button class="nav" data-page="analises">◉ Análises</button><button class="nav" data-page="config">⚙ Configurações</button></nav><small>Sincronizado com Supabase</small><button id="logoutBtn" type="button">Sair da conta</button></aside><main><header><div><span class="eyebrow">CONTROLE FINANCEIRO PESSOAL</span><h1 id="pageTitle">Dashboard</h1></div><div class="toolbar"><input id="month" type="month"><button id="addBtn" class="primary">+ Novo lançamento</button></div></header><div id="notice" role="status"></div><section id="dashboard" class="page"></section><section id="lancamentos" class="page hidden"></section><section id="parcelas" class="page hidden"></section><section id="projecoes" class="page hidden"></section><section id="analises" class="page hidden"></section><section id="config" class="page hidden"></section></main></div><dialog id="entryDialog"><form id="entryForm"><div class="dialogHead"><h2 id="entryDialogTitle">Novo lançamento</h2><button type="button" id="closeDialog" class="quiet">✕</button></div><label>Tipo<select name="type" id="entryType"><option value="expense">Despesa</option><option value="income">Receita</option></select></label><label>Descrição<input name="description" required maxlength="120" placeholder="Ex.: Compra de equipamento"></label><div class="two"><label>Valor total (R$)<input name="amount" type="number" min="0.01" step="0.01" required placeholder="1200.00"></label><label>Categoria<select name="category" id="entryCategory"></select></label></div><div class="two"><label>Data da primeira ocorrência<input name="date" type="date" required></label><label>Forma<select name="payment" id="payment"><option value="single">À vista</option><option value="installment">Parcelado</option></select></label></div><label>Tag / origem do pagamento<input name="tag" id="entryTag" list="tagSuggestions" maxlength="60" placeholder="Ex.: Cartão de crédito"><datalist id="tagSuggestions"><option value="Cartão de crédito"><option value="Pix"><option value="Dinheiro"><option value="Débito"><option value="Boleto"><option value="Crediário"><option value="Poupança"></datalist></label><label id="partsWrap" class="hidden">Quantidade de parcelas<input name="parts" type="number" min="2" max="120" value="6"></label><p class="muted" id="installmentPreview"></p><div class="actions"><button type="button" id="cancelDialog">Cancelar</button><button class="primary" id="saveEntryBtn" type="submit">Salvar lançamento</button></div></form></dialog><input type="file" id="importFile" accept="application/json,.json" hidden><input type="file" id="mergeFile" accept="application/json,.json" hidden><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.min.js"></script><script src="config.js"></script><script src="cloud.js"></script><script src="app.js"></script></body></html>
